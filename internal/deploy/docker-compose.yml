version: '3.8'

services:
  srv_demo-st: # 运行的服务名称
    build:
      context: ../..
      dockerfile: ./demo/Dockerfile
    image: demo:st # 将构建出的镜像命名
    container_name: srv_demo-st # 容器名称
    environment: # 运行时候的环境变量
      - GOROUTINES=2
      - MODEL=/data/models
    volumes:
      - /root/tools/models:/app/models:ro
      - ./config.yaml:/app/config.yaml:ro
    networks:
      - test-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G
    networks:
      network-network:
        aliases:
          - demo-net

networks:
  test-network:
    driver: bridge

# 使用示例:
# 1. 构建镜像: docker-compose build
# 2. 运行测试: docker-compose up
# 3. 后台运行: docker-compose up -d
# 4. 查看日志: docker-compose logs -f
# 5. 停止服务: docker-compose down
# docker-compose up web           # 只启动 web 服务
# docker-compose logs web         # 查看 web 服务日志
# docker-compose exec web bash    # 进入 web 容器
